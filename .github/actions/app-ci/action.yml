name: App CI + image
description: Lint, typecheck rồi build image Docker (push lên GHCR nếu push=true).

inputs:
  push:
    description: "true → push image lên GHCR"
    default: "false"
  self-hosted:
    description: "true → chạy trên self-hosted runner: dùng cache layer của Docker trên máy, không dùng cache GHA"
    default: "false"
  token:
    description: GITHUB_TOKEN để đăng nhập GHCR
    required: true

outputs:
  image:
    description: Image đã build kèm tag sha
    value: ${{ steps.meta.outputs.image }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm

    - name: Cài dependency
      shell: bash
      run: npm ci

    - name: Lint
      shell: bash
      run: npm run lint

    - name: Typecheck
      shell: bash
      # next typegen sinh type PageProps/RouteContext cho các route trước khi chạy tsc
      run: npm run typecheck

    - name: Tên image
      id: meta
      shell: bash
      run: |
        repo="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/inventory"
        echo "repo=$repo" >> "$GITHUB_OUTPUT"
        echo "image=$repo:${{ github.sha }}" >> "$GITHUB_OUTPUT"

    - name: Set up Buildx
      if: inputs.self-hosted != 'true'
      uses: docker/setup-buildx-action@v3

    - name: Login GHCR
      if: inputs.push == 'true'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - name: Build${{ inputs.push == 'true' && ' & push' || '' }} image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: ${{ inputs.push == 'true' }}
        provenance: false
        tags: |
          ${{ steps.meta.outputs.image }}
          ${{ steps.meta.outputs.repo }}:latest
        labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        cache-from: ${{ inputs.self-hosted != 'true' && 'type=gha,scope=app' || '' }}
        cache-to: ${{ inputs.self-hosted != 'true' && 'type=gha,scope=app,mode=max' || '' }}
