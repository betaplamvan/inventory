# CI/CD: build ưu tiên ubuntu-latest của GitHub; job đó KHÔNG khởi động được (hết quota phút)
# → build lại trên self-hosted runner (Linux x64). Deploy luôn chạy trên runner đó. Chi tiết: deploy/README.md.
name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "deploy/README.md"
      - "deploy/sync-secrets.sh"
      - "deploy/.env.production.example"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      runner:
        description: "Nơi build (auto = GitHub trước, hết quota thì self-hosted)"
        type: choice
        options: [auto, github, self-hosted]
        default: auto

# Không hủy run đang deploy trên main; PR thì chỉ giữ run mới nhất.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build (GitHub)
    # Biến repo CI_RUNNER=self-hosted → bỏ hẳn GitHub-hosted (khi biết chắc đã hết quota).
    if: ${{ (inputs.runner || vars.CI_RUNNER || 'auto') != 'self-hosted' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # Có giá trị = job đã thật sự chạy. Job hỏng vì hết quota thì không có bước nào chạy → rỗng.
      started: ${{ steps.mark.outputs.started }}
    steps:
      - id: mark
        run: echo "started=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: ./.github/actions/app-ci
        with:
          push: ${{ github.event_name != 'pull_request' }}
          token: ${{ secrets.GITHUB_TOKEN }}

  build-fallback:
    name: Build (self-hosted, dự phòng)
    needs: build
    # Chạy khi: GitHub-hosted bị tắt (skipped), hoặc job GitHub thất bại mà CHƯA chạy bước nào
    # (không nhận được runner — hết quota/spending limit). Lỗi code thật (lint đỏ) thì không chạy lại.
    # KHÔNG BAO GIỜ chạy cho pull_request: repo public, PR từ fork sẽ chạy code lạ trên máy chủ self-hosted.
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' && (inputs.runner || vars.CI_RUNNER || 'auto') != 'github' && (
        needs.build.result == 'skipped' ||
        (needs.build.result == 'failure' && needs.build.outputs.started != 'true')
      ) }}
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/app-ci
        with:
          push: ${{ github.event_name != 'pull_request' }}
          self-hosted: "true"
          token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy (self-hosted)
    needs: [build, build-fallback]
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      (needs.build.result == 'success' || needs.build-fallback.result == 'success') }}
    runs-on: [self-hosted, linux, x64]
    environment: production
    timeout-minutes: 15
    concurrency:
      group: deploy-inventory
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy

      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Deploy inventory
        env:
          NAME: inventory
          IMAGE: ghcr.io/${{ github.repository_owner }}/inventory:${{ github.sha }}
          # Chỉ mở trên localhost — Cloudflare Tunnel trỏ tên miền vào cổng này
          PORT_MAP: 127.0.0.1:${{ vars.APP_PORT || '3040' }}:3000
          NETWORK: ${{ vars.DOCKER_NETWORK || 'inventory' }}
          MEM_LIMIT: ${{ vars.APP_MEM_LIMIT || '768m' }}
          CPU_LIMIT: ${{ vars.APP_CPU_LIMIT || '1.5' }}
          REQUIRED_ENV: >-
            DATABASE_URL MINIO_ENDPOINT MINIO_ACCESS_KEY MINIO_SECRET_KEY MINIO_BUCKET
            GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET APP_BASE_URL
          PASS_ENV: >-
            DATABASE_URL MINIO_ENDPOINT MINIO_PORT MINIO_USE_SSL MINIO_ACCESS_KEY MINIO_SECRET_KEY
            MINIO_BUCKET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET APP_BASE_URL COOKIE_SECURE MAX_UPLOAD_MB
            TELEGRAM_BOT_TOKEN SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS SMTP_FROM
            LLM_BASE_URL LLM_API_KEY LLM_MODEL
          # Bí mật → secrets; cấu hình không nhạy cảm → vars (Environment "production").
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          MINIO_ENDPOINT: ${{ vars.MINIO_ENDPOINT }}
          MINIO_PORT: ${{ vars.MINIO_PORT }}
          MINIO_USE_SSL: ${{ vars.MINIO_USE_SSL }}
          MINIO_BUCKET: ${{ vars.MINIO_BUCKET }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          COOKIE_SECURE: ${{ vars.COOKIE_SECURE || 'true' }}
          MAX_UPLOAD_MB: ${{ vars.MAX_UPLOAD_MB }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          export IMAGE="${IMAGE,,}"
          bash deploy/deploy-container.sh

      - name: Dọn image cũ trên GHCR (giữ 10 bản)
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: inventory
          package-type: container
          min-versions-to-keep: 10
